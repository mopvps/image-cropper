<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Cropper E-pub</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/midnight.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
</head>
<body>

<!-- ── Header ── -->
<div id="header">
  <div id="header-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
    </svg>
    <span id="header-brand-label"></span>
  </div>

  <nav id="header-tabs"><!-- populated by JS from /config --></nav>

  <button id="theme-toggle" class="btn btn-secondary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <span class="theme-label">Dark</span>
  </button>
</div>

<!-- ── Main ── -->
<div id="main">

  <!-- LEFT: Upload + Thumbnails -->
  <div id="left">

    <div id="sidebar-logo" style="
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;">
      <img src="/static/logo.webp" alt="VilPower"
        style="max-width: 160px; max-height: 60px; object-fit: contain;">
    </div>

    <div id="upload-section">
      <span class="upload-label">Select Files</span>

      <!-- PDF -->
      <div class="file-input-wrap" id="pdfWrap" onclick="browseFile('file','pdfPath')" style="cursor:pointer;">
        <div class="file-input-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>PDF File</span>
          <span class="file-name" id="pdfName">No file chosen</span>
        </div>
      </div>
      <input type="hidden" id="pdfPath">

      <!-- Folder -->
      <div class="file-input-wrap" id="xhtmlWrap" onclick="browseFile('folder','folderPath')" style="cursor:pointer;">
        <div class="file-input-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>XHTML Folder</span>
          <span class="file-name" id="xhtmlName">No folder chosen</span>
        </div>
      </div>
      <input type="hidden" id="folderPath">

      <button id="uploadBtn" class="btn btn-primary" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Process
      </button>
      <div class="uploading-text" id="uploadingText"></div>
    </div>

  </div>

  <!-- MIDDLE-LEFT: PDF scroll viewer -->
  <div id="middle-left">
    <div id="viewer-header">
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span style="font-size:11px;font-weight:700;text-transform:uppercase;
          letter-spacing:.6px;color:var(--muted);">PDF Pages</span>
        <span id="cropModeBtn" style="
          font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;cursor:pointer;
          background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
          letter-spacing:.4px;white-space:nowrap;transition:all .15s;
        ">Alt+C: Crop OFF</span>
        <button id="highlightToggleBtn" class="btn btn-secondary" style="
          font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;
          display:none;white-space:nowrap;" title="Toggle Highlighted PDF">
          📄 Original
        </button>
      </div>

      <div id="searchBar" style="display:flex;align-items:center;gap:5px;flex:1;
        justify-content:center;max-width:380px;margin:0 auto;">
        <input id="searchInput" type="text" placeholder="Search in PDF…"
          style="font-family:'Inter',sans-serif;font-size:12px;padding:4px 10px;
          border:1px solid var(--border);border-radius:6px;background:var(--surface-2);
          color:var(--text);outline:none;flex:1;min-width:0;" />
        <button id="searchBtn" class="btn btn-secondary"
          style="padding:4px 10px;font-size:12px;flex-shrink:0;">Find</button>
        <button id="searchPrev" class="btn btn-secondary"
          style="padding:4px 7px;font-size:11px;flex-shrink:0;">▲</button>
        <button id="searchNext" class="btn btn-secondary"
          style="padding:4px 7px;font-size:11px;flex-shrink:0;">▼</button>
      </div>

      <span id="searchCount" style="font-size:11px;color:var(--muted);
        white-space:nowrap;flex-shrink:0;min-width:60px;text-align:right;"></span>

      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
        <button id="pdfZoomOut" class="btn btn-secondary" style="padding:2px 8px;font-size:13px;">−</button>
        <span id="pdfZoomLevel" style="font-size:11px;color:var(--muted);min-width:36px;text-align:center;">100%</span>
        <button id="pdfZoomIn"  class="btn btn-secondary" style="padding:2px 8px;font-size:13px;">+</button>
        <button id="pdfZoomReset" class="btn btn-secondary" style="padding:2px 8px;font-size:11px;">↺</button>
        <button id="fullscreenBtn" class="btn btn-secondary" onclick="toggleFullscreen()" title="Fullscreen (Alt+Enter)">
          <span id="fullscreenIcon">⛶</span> <span id="fullscreenLabel">Fullscreen</span>
        </button>
      </div>
    </div>
    <div id="canvas-wrap" style="position:relative;">
      <!-- Empty state -->
      <div id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <span>Upload a PDF + XHTML to get started</span>
      </div>
      <div id="pagesContainer"><!-- populated by JS: .pdf-page > canvas --></div>
      <iframe id="highlightFrame" src="" style="display:none;width:100%;height:100%;border:none;position:absolute;inset:0;"></iframe>
    </div>
  </div>

  <!-- MIDDLE-RIGHT: XHTML Preview -->
  <div id="middle-right">
    <div id="preview-header">
      <span id="previewTitle">XHTML Preview</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <div style="display:flex;align-items:center;gap:4px;">
          <button id="xhtmlZoomOut"   class="btn btn-secondary" style="padding:2px 8px;font-size:13px;">−</button>
          <span id="xhtmlZoomLevel"   style="font-size:11px;color:var(--muted);min-width:36px;text-align:center;">100%</span>
          <button id="xhtmlZoomIn"    class="btn btn-secondary" style="padding:2px 8px;font-size:13px;">+</button>
          <button id="xhtmlZoomReset" class="btn btn-secondary" style="padding:2px 8px;font-size:11px;">↺</button>
        </div>
        <button id="highlightTagBtn" class="btn btn-secondary"
          style="padding:3px 10px;font-size:11px;white-space:nowrap;">
          🎨 Highlight ▾
        </button>
        <button onclick="refreshXhtml()" id="refreshBtn" class="btn btn-secondary" style="padding:3px 10px;font-size:11px;">↺ Refresh</button>
        <button onclick="toggleXhtmlEdit()" id="editXhtmlBtn" class="btn btn-secondary" style="padding:3px 10px;font-size:11px;">✏ Edit</button>        <button onclick="saveXhtmlEdit()" id="saveXhtmlBtn" class="btn btn-success" style="padding:3px 10px;font-size:11px;display:none;">💾 Save</button>
        <button onclick="cancelXhtmlEdit()" id="cancelXhtmlBtn" class="btn btn-secondary" style="padding:3px 10px;font-size:11px;display:none;">✕ Cancel</button>
      </div>
    </div>
    <div id="preview-wrap">
      <iframe id="xhtmlFrame" src="" style="width:100%;height:100%;border:none;"></iframe>
      <textarea id="xhtmlEditor" style="display:none;width:100%;height:100%;
        font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;
        padding:16px;border:none;outline:none;resize:none;
        background:var(--code-bg);color:var(--code-text);
        box-sizing:border-box;"></textarea>
    </div>
  </div>

  <!-- RIGHT: Image chips + download -->
  <div id="right">

    <div id="chips-header">
      <span>Images</span>
      <span id="chips-count" style="color:var(--muted);font-weight:400">—</span>
      <button id="rightToggleBtn" onclick="toggleRightSidebar()" title="Toggle Images Panel (Ctrl+Shift+Enter)"
        style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;
        padding:2px 4px;line-height:1;transition:color .15s;">›</button>
    </div>
    <div id="chips">
      <span style="font-size:12px;color:var(--muted)">Upload files to see image list</span>
    </div>

    <div id="saveStatus" style="margin:12px 16px;font-size:12px;color:var(--pass);font-family:'JetBrains Mono',monospace;"></div>

  </div>
</div>

<!-- ── Crop refine modal ── -->
<div id="cropModal" style="display:none">
  <div id="cropModalBackdrop"></div>
  <div id="cropModalBox">
    <div id="cropModalHeader">
      <span>Adjust Crop</span>
      <button id="cropModalClose">✕</button>
    </div>
    <div id="cropModalCanvas-wrap">
      <canvas id="cropModalCanvas"></canvas>
    </div>
    <div id="cropModalFooter">
      <button id="cropModalCancel" class="btn btn-secondary">Cancel</button>
      <button id="cropModalTrim" class="btn btn-secondary">✂ Auto Trim</button>
      <button id="cropModalSave" class="btn btn-success">Save Image</button>
    </div>
  </div>
</div>

<div id="highlightTagPanel" style="
  display:none; position:fixed;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.15);
  padding:8px; z-index:99999; min-width:160px;
  font-family:'Inter',sans-serif;">
  <label style="display:flex;align-items:center;gap:8px;padding:5px 8px;
    border-radius:5px;cursor:pointer;font-size:12px;color:var(--text);">
    <input type="checkbox" id="hlBold"> Bold
    <span style="width:12px;height:12px;border-radius:2px;
      background:#FFEB3B;display:inline-block;margin-left:auto;"></span>
  </label>
  <label style="display:flex;align-items:center;gap:8px;padding:5px 8px;
    border-radius:5px;cursor:pointer;font-size:12px;color:var(--text);">
    <input type="checkbox" id="hlItalic"> Italic
    <span style="width:12px;height:12px;border-radius:2px;
      background:#7DE87D;display:inline-block;margin-left:auto;"></span>
  </label>
  <label style="display:flex;align-items:center;gap:8px;padding:5px 8px;
    border-radius:5px;cursor:pointer;font-size:12px;color:var(--text);">
    <input type="checkbox" id="hlSup"> Superscript
    <span style="width:12px;height:12px;border-radius:2px;
      background:#66BFFF;display:inline-block;margin-left:auto;"></span>
  </label>
  <label style="display:flex;align-items:center;gap:8px;padding:5px 8px;
    border-radius:5px;cursor:pointer;font-size:12px;color:var(--text);">
    <input type="checkbox" id="hlSub"> Subscript
    <span style="width:12px;height:12px;border-radius:2px;
      background:#FF9933;display:inline-block;margin-left:auto;"></span>
  </label>
</div>

<!-- CodeMirror custom search bar -->
<div id="cmSearchBar" style="display:none;position:absolute;z-index:9999;
  top:44px;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.15);
  padding:6px 10px;display:none;align-items:center;gap:6px;min-width:320px;">
  <input id="cmSearchInput" type="text" placeholder="Search…"
    style="font-family:'JetBrains Mono',monospace;font-size:12px;
    padding:4px 10px;border:1px solid var(--border);border-radius:6px;
    background:var(--surface-2);color:var(--text);outline:none;flex:1;width:200px;"/>
  <span id="cmSearchCount" style="font-size:11px;color:var(--muted);white-space:nowrap;min-width:50px;"></span>
  <button id="cmSearchPrev" class="btn btn-secondary" style="padding:3px 8px;font-size:12px;">▲</button>
  <button id="cmSearchNext" class="btn btn-secondary" style="padding:3px 8px;font-size:12px;">▼</button>
  <button id="cmSearchClose" class="btn btn-secondary" style="padding:3px 8px;font-size:12px;">✕</button>
</div>

<div id="selectionEditBtn" style="display:none;position:fixed;z-index:3000;
  background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.25);font-family:'Inter',sans-serif;">
  ✏ Edit
</div>

<script src="/static/app.js"></script>
</body>
</html>
